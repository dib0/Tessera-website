# nginx with the Tessera module: the site is a shared library (libsite.so) loaded into the workers.
# The master runs as root only to drop the workers to the `tessera` user.
user tessera;
worker_processes auto;
error_log /dev/stderr info;
pid /run/nginx.pid;

# nginx clears the environment of its workers. These variables are passed on to the Tessera program.
env ADMIN_USER;
env ADMIN_PASSWORD;
env SITE_DB;
env TESSERA_FS_ROOT;
env TESSERA_SQLITE3;
env PATH;

# Requests run on a thread pool, so a slow request does not block the other connections of a worker.
thread_pool tessera threads=16;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    # Limits of the Tessera runtime (see hosts/README.md in the language repository).
    tessera_env TESSERA_TIME_LIMIT_MS 10000;
    tessera_env TESSERA_MEMORY_LIMIT_MB 256;
    tessera_env TESSERA_MAX_BODY_MB 1;

    client_max_body_size 1m;

    server {
        listen 8080 default_server;
        server_name _;

        location / {
            tessera /opt/tessera/libsite.so;
            tessera_max_body 1m;
            tessera_thread_pool tessera;
        }
    }
}
